<div class="p-3">
  <button
    type="button"
    class="text-ink hover:bg-surface-muted flex min-h-11 w-full cursor-pointer items-center rounded-card px-2 text-left text-sm"
    [class.font-semibold]="selected() === null"
    (click)="picked.emit(null)"
  >
    {{ 'catalog.filters.allCategories' | transloco }}
  </button>

  @for (section of tree(); track section.id) {
    <p class="text-ink-faint mt-3 px-2 text-xs font-bold uppercase">{{ section.label }}</p>

    <button
      type="button"
      class="text-ink hover:bg-surface-muted flex min-h-11 w-full cursor-pointer items-center rounded-card px-2 text-left text-sm"
      [class.font-semibold]="selected() === section.id"
      (click)="picked.emit(section.id)"
    >
      {{ 'catalog.filters.everythingIn' | transloco: { category: section.label } }}
    </button>

    @for (child of section.children; track child.id) {
      <button
        type="button"
        class="text-ink hover:bg-surface-muted flex min-h-11 w-full cursor-pointer items-center rounded-card px-2 text-left text-sm"
        [class.font-semibold]="selected() === child.id"
        (click)="picked.emit(child.id)"
      >
        {{ child.label }}
      </button>
    }
  }
</div>
