<form class="p-3" (submit)="$event.preventDefault(); apply()">
  <div class="flex items-center gap-2">
    <span
      class="border-border bg-surface-muted flex grow items-center rounded-card border px-3 py-2"
    >
      <app-number-input
        [value]="draftFrom()"
        (valueChange)="draftFrom.set($event)"
        [min]="0"
        [placeholder]="'catalog.filters.priceFrom' | transloco"
        [ariaLabel]="'catalog.filters.priceFrom' | transloco"
      />
    </span>
    <span class="text-ink-faint" aria-hidden="true">—</span>
    <span
      class="border-border bg-surface-muted flex grow items-center rounded-card border px-3 py-2"
    >
      <app-number-input
        [value]="draftTo()"
        (valueChange)="draftTo.set($event)"
        [min]="0"
        [placeholder]="'catalog.filters.priceTo' | transloco"
        [ariaLabel]="'catalog.filters.priceTo' | transloco"
      />
    </span>
  </div>

  <div class="mt-3 flex items-center justify-between gap-2">
    <button
      type="button"
      class="text-ink-faint hover:text-ink min-h-11 cursor-pointer text-sm"
      (click)="clear()"
    >
      {{ 'catalog.filters.clear' | transloco }}
    </button>
    <button appButton="primary" type="submit">
      {{ 'catalog.filters.apply' | transloco }}
    </button>
  </div>
</form>
