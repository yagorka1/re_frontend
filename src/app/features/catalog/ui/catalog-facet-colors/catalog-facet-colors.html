<ul class="grid grid-cols-2 gap-1 p-3">
  @for (option of options(); track option.id) {
    <li>
      <button
        type="button"
        class="hover:bg-surface-muted flex min-h-11 w-full cursor-pointer items-center gap-2.5 rounded-card px-2 text-left text-sm"
        [attr.aria-pressed]="isSelected(option.id)"
        (click)="toggled.emit(option.id)"
      >
        <!-- The ring marks the selection from outside the swatch: a tick drawn inside would
             need a different colour on every shade. -->
        <span
          class="border-border ring-ink h-5 w-5 shrink-0 rounded-full border"
          [class.ring-2]="isSelected(option.id)"
          [class.ring-offset-2]="isSelected(option.id)"
          [style.background-color]="option.hex"
        ></span>
        <span class="text-ink truncate" [class.font-semibold]="isSelected(option.id)">
          {{ option.label }}
        </span>
      </button>
    </li>
  }
</ul>
