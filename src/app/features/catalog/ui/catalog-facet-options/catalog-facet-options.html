<!-- Neither width nor height is decided here: a popover panel caps and scrolls it, the mobile
     sheet lets it run to its natural length. The search box sticks so it survives either. -->
<div>
  @if (searchable()) {
    <div class="bg-surface sticky top-0 z-10 p-3 pb-0">
      <div
        class="border-border bg-surface-muted flex items-center gap-2 rounded-card border px-3 py-2"
      >
        <app-icon name="search" [size]="15" class="text-ink-faint shrink-0" />
        <app-input
          type="search"
          [value]="query()"
          (valueChange)="query.set($event)"
          [placeholder]="'catalog.filters.searchOptions' | transloco"
          [ariaLabel]="'catalog.filters.searchOptions' | transloco"
        />
      </div>
    </div>
  }

  <div class="p-3">
    @for (option of visibleOptions(); track option.id) {
      <app-checkbox [value]="isSelected(option.id)" (valueChange)="toggled.emit(option.id)">
        <span class="grow">{{ option.label }}</span>
        @if (option.count !== undefined) {
          <span class="text-ink-faint text-xs">{{ option.count }}</span>
        }
      </app-checkbox>
    } @empty {
      <p class="text-ink-faint px-1 py-2 text-sm">{{ 'catalog.filters.noOptions' | transloco }}</p>
    }
  </div>
</div>
