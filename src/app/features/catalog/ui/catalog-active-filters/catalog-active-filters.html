@if (filters().length > 0) {
  <ul class="flex flex-wrap items-center gap-2">
    @for (filter of filters(); track filter.facet + ':' + filter.id) {
      <li>
        <button
          type="button"
          class="border-border bg-surface-muted text-ink hover:border-ink flex h-9 cursor-pointer items-center gap-1.5 rounded-full border pr-2 pl-3 text-sm font-medium"
          (click)="removed.emit(filter)"
        >
          @let key = filter.labelKey;
          <span>{{
            key === undefined ? filter.label : (key | transloco: filter.labelParams)
          }}</span>
          <app-icon name="x" [size]="14" class="text-ink-faint" />
          <span class="sr-only">{{ 'catalog.filters.remove' | transloco }}</span>
        </button>
      </li>
    }

    <li>
      <button
        type="button"
        class="text-ink-faint hover:text-ink h-9 cursor-pointer px-1 text-sm underline underline-offset-2"
        (click)="cleared.emit()"
      >
        {{ 'catalog.filters.clearAll' | transloco }}
      </button>
    </li>
  </ul>
}
