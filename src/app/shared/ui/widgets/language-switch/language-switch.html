<app-popover #popover align="end" ariaHasPopup="listbox" [ariaLabel]="'language.label' | transloco">
  <app-icon name="globe" />
  <span class="uppercase">{{ activeLang() }}</span>

  <ng-template appPopoverPanel>
    <ul class="min-w-36 py-1" role="listbox">
      @for (language of languages; track language.id) {
        <li>
          <button
            type="button"
            role="option"
            class="text-ink hover:bg-surface-muted flex w-full cursor-pointer items-center justify-between px-3 py-2 text-left text-sm font-medium"
            [attr.aria-selected]="isActiveLanguage(language.id)"
            [class.text-brand]="isActiveLanguage(language.id)"
            (click)="select(language.id); popover.close()"
          >
            {{ language.label }}
          </button>
        </li>
      }
    </ul>
  </ng-template>
</app-popover>
