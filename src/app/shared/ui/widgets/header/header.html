<header class="border-border bg-surface sticky top-0 z-40 border-b px-4 py-3 lg:px-12">
  <div
    class="flex flex-wrap items-center gap-3 lg:mx-auto lg:max-w-[1440px] lg:flex-nowrap lg:gap-9"
  >
    <app-logo />

    <div class="ml-auto flex shrink-0 items-center gap-2">
      <button
        type="button"
        appButton="icon"
        [attr.aria-label]="'header.actions.wishlist' | transloco"
      >
        <app-icon name="heart" />
      </button>

      <button
        type="button"
        appButton="icon"
        class="hidden lg:flex"
        [attr.aria-label]="'header.actions.messages' | transloco"
      >
        <app-icon name="message-circle" />
      </button>

      <button
        type="button"
        appButton="icon-accent"
        [attr.aria-label]="'header.actions.profile' | transloco"
      >
        <app-icon name="user" />
      </button>

      <app-language-switch />
      <app-theme-toggle />

      <button type="button" appButton="primary" class="hidden lg:flex">
        <app-icon name="plus" [size]="16" />
        {{ 'header.actions.sell' | transloco }}
      </button>
    </div>
  </div>
</header>
