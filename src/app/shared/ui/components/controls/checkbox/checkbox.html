<label
  class="text-ink flex min-h-11 cursor-pointer items-center gap-3 text-sm"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-50]="disabled()"
>
  <input
    type="checkbox"
    class="accent-brand h-4 w-4 shrink-0 cursor-pointer"
    [checked]="value()"
    [disabled]="disabled()"
    (change)="value.set($any($event.target).checked)"
  />
  <ng-content />
</label>
